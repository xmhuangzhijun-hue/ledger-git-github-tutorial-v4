<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随手账 · 记账 MVP 演示</title>
<style>
:root{--canvas:#f1f5fb;--paper:#fff;--ink:#172842;--muted:#6d8099;--line:#e2e9f2;--blue:#2256db;--teal:#17867d;--orange:#bd613f}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:15px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94b5ff;outline-offset:3px}.app{display:grid;grid-template-columns:222px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:38px 24px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:750;letter-spacing:2px}.logo{width:39px;height:43px;background:var(--blue);border-radius:9px;display:grid;place-items:center;color:white;font:25px Georgia,serif}.side-label{color:var(--muted);font-size:12px;letter-spacing:2px;margin:57px 12px 17px}.nav{padding:15px 18px;background:#edf3ff;color:var(--blue);font-weight:650;border-radius:9px;display:flex;gap:16px;align-items:center}.nav svg{width:20px;height:20px}.side-note{margin-top:auto;padding:32px 12px 5px;font-size:12px;line-height:1.9;color:var(--muted)}.side-note strong{display:block;font-size:14px;color:var(--ink);margin-bottom:8px}.main{padding:40px 48px;max-width:1550px;width:100%;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.eyebrow{color:var(--muted);letter-spacing:2px;font-size:12px}.local-pill{border:1px solid var(--line);border-radius:30px;padding:8px 13px;color:var(--muted);background:white;font-size:12px}.local-pill:before{content:'';display:inline-block;width:6px;height:6px;background:var(--teal);border-radius:50%;margin-right:8px}h1{font-weight:730;font-size:34px;letter-spacing:-1px;margin:0 0 11px}.intro{color:var(--muted);margin:0;line-height:1.7}.workspace{margin-top:34px;display:grid;grid-template-columns:335px minmax(0,1fr);gap:29px;align-items:start}.entry{position:relative;background:var(--paper);border-radius:12px 12px 0 0;padding:27px 27px 32px;box-shadow:0 12px 30px #16385707;border:1px solid var(--line);border-bottom:0}.entry:after{content:'';position:absolute;left:-1px;right:-1px;bottom:-12px;height:13px;background:linear-gradient(135deg,white 25%,transparent 25%) -1px 0/20px 20px,linear-gradient(225deg,white 25%,transparent 25%) -1px 0/20px 20px;filter:drop-shadow(0 1px 0 #e2e9f2)}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.section-heading h2{font-size:18px;margin:0}.tiny-badge{font-size:11px;color:var(--teal);background:#edf8f5;padding:5px 8px;border-radius:4px}.amount-label{font-size:12px;color:var(--muted)}.amount-line{display:flex;align-items:baseline;border-bottom:1px dashed #bccada;padding:9px 0 13px;margin-bottom:24px}.amount-line span{font:28px Georgia,serif;color:var(--muted);margin-right:12px}.amount-line input{font:48px Consolas,'Courier New',monospace;width:100%;border:0;outline:none;padding:0;background:transparent;color:var(--ink);min-width:0}.amount-line input::placeholder{color:#c2cedd}.field{margin-bottom:19px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px;color:var(--ink);height:43px}.field input::placeholder{color:#a4b2c4}.primary{width:100%;border:0;border-radius:7px;padding:14px;background:var(--blue);color:white;font-weight:650;box-shadow:0 4px 8px #2256db12}.primary:hover{background:#194bc8}.cancel{border:0;color:var(--muted);background:transparent;margin:14px auto 0;display:block}.status{min-height:19px;font-size:12px;margin:16px 0 0;color:var(--muted);line-height:1.6}.status.success{color:var(--teal)}.status.error{color:var(--orange)}.overview{display:grid;gap:24px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stat{background:white;border:1px solid var(--line);border-radius:11px;padding:21px 24px}.stat-title{color:var(--muted);font-size:12px}.stat-number{font:42px Consolas,'Courier New',monospace;letter-spacing:-2px;display:block;margin:10px 0 7px}.stat-sub{color:var(--muted);font-size:12px}.stat-number small{font-size:20px;letter-spacing:0;margin-left:8px;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden}.panel-head{padding:23px 23px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}.panel-head h2{margin:0;font-size:17px}.month{border:1px solid var(--line);border-radius:5px;color:var(--muted);padding:7px 8px;font-size:12px;max-width:170px;background:white}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-size:11px;color:var(--muted);font-weight:500;padding:11px 22px;background:#f8fafd;white-space:nowrap}.table td{padding:20px 22px;border-top:1px solid #eef2f7;font-size:13px}.table td:nth-child(2){padding-left:10px}.table th:nth-child(2){padding-left:10px}.record-name{font-weight:650;margin-bottom:6px}.category-label{font-size:11px;color:var(--muted)}.record-amount{font:20px Consolas,monospace;white-space:nowrap}.edit{background:transparent;border:1px solid #dce5f3;color:var(--blue);border-radius:5px;font-size:12px;padding:7px 10px}.delete{background:transparent;border:0;color:var(--muted);font-size:11px;padding:8px}.empty{padding:39px 24px 42px;text-align:center}.empty-symbol{font:38px Georgia,serif;color:#bccada;margin-bottom:12px}.empty p{color:var(--muted);font-size:13px;margin:7px}.empty strong{font-size:15px}.category-wrap{padding:0 24px 23px}.category-row{display:grid;grid-template-columns:48px 1fr 83px;gap:16px;align-items:center;margin:17px 0;font-size:12px}.track{height:6px;border-radius:9px;background:#edf1f7;overflow:hidden}.bar{height:100%;background:var(--blue);border-radius:9px;transition:width .4s ease}.cat-money{font:14px Consolas,monospace;text-align:right;color:var(--ink)}.footer{display:flex;justify-content:space-between;margin-top:32px;color:var(--muted);font-size:11px;line-height:1.8}.feedback{background:#fff6ed;border:1px solid #f0d8be;padding:12px 16px;border-radius:8px;color:var(--orange);margin:20px 0;font-size:13px}.flash{animation:flash .8s ease} @keyframes flash{0%{background:#e5efff}100%{background:white}}[hidden]{display:none!important}@media(max-width:1100px){.sidebar{display:none}.app{grid-template-columns:1fr}.main{padding:30px}.workspace{grid-template-columns:315px minmax(0,1fr)}.table td,.table th{padding-left:14px;padding-right:14px}}@media(max-width:760px){.main{padding:24px 18px}.workspace{grid-template-columns:1fr;gap:34px}.summary{gap:12px}.stat{padding:18px}.stat-number{font-size:33px}.topline{margin-bottom:26px}.local-pill{font-size:10px}.intro{font-size:13px}.footer{flex-direction:column;gap:6px}.table td,.table th{padding-left:11px;padding-right:11px}.table td:nth-child(2){font-size:11px}.record-amount{font-size:17px}h1{font-size:29px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">¥</span>随手账</div><div class="side-label">我的账本</div><div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>收支记录</div><div class="side-note"><strong>先记好一笔。</strong>少填一点，清楚一点。<br>把每一笔日常支出留下来。</div></aside>
<main class="main"><div class="topline"><span class="eyebrow">PERSONAL LEDGER</span><span class="local-pill">保存在本浏览器</span></div><h1>把今天记清楚。</h1><p class="intro">从一顿午饭开始，慢慢看清自己的日常支出。</p><div id="load-error" class="feedback" role="alert" hidden></div>
<div class="workspace"><section class="entry"><div class="section-heading"><h2 id="form-title">记一笔支出</h2><span class="tiny-badge">人民币 CNY</span></div><form id="entry-form"><label class="amount-label" for="amount">支出金额</label><div class="amount-line"><span>¥</span><input id="amount" name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" required aria-describedby="save-status"></div><div class="field"><label for="date">消费日期</label><input type="date" id="date" name="date" required></div><div class="field"><label for="category">支出分类</label><select id="category" name="category"><option>餐饮</option><option>交通</option><option>购物</option><option>居家</option><option>其他</option></select></div><div class="field"><label for="note">备注</label><input id="note" name="note" placeholder="例如：午饭" maxlength="60" autocomplete="off"></div><button id="save" class="primary" type="submit">保存这笔支出</button><button id="cancel" class="cancel" type="button" hidden>取消修改</button><p id="save-status" class="status" role="status" aria-live="polite">保存后，可以在右侧查看和修改。</p></form></section>
<div class="overview"><div class="summary"><section class="stat"><span class="stat-title">所选月份支出</span><strong id="total" class="stat-number">¥0.00</strong><span id="summary-month" class="stat-sub"></span></section><section class="stat"><span class="stat-title">已记录</span><strong class="stat-number"><span id="count">0</span><small>笔</small></strong><span class="stat-sub">与下方明细使用同一范围</span></section></div>
<section class="panel"><div class="panel-head"><h2>支出明细</h2><input type="month" id="month" class="month" aria-label="查看月份" required></div><table id="ledger-table" class="table" hidden><thead><tr><th>这笔花在哪里</th><th>消费日期</th><th>金额</th><th>操作</th></tr></thead><tbody id="records"></tbody></table><div id="empty" class="empty"><div class="empty-symbol">＋</div><strong>这个月，还没有记录</strong><p>在左侧记一笔，支出就会出现在这里。</p></div></section>
<section class="panel"><div class="panel-head"><h2>钱花在哪里</h2><span class="stat-sub">按所选月份汇总</span></div><div id="categories" class="category-wrap"></div></section></div></div><footer class="footer"><span>仅记录支出 · 不连接银行或支付账户</span><span>演示工具 · 换浏览器不会自动同步</span></footer></main></div>
<script>
'use strict';
const STORAGE='ledger-mvp-demo-v1';const $=s=>document.querySelector(s);const categories=['餐饮','交通','购物','居家','其他'];
let rows=[],editing=null,saving=false,loadFailed=false;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function validDay(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return !isNaN(d)&&`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===s}
function money(c){return '¥'+(c/100).toFixed(2)}
function status(msg,type=''){const el=$('#save-status');el.textContent=msg;el.className='status '+type}
function read(){const raw=localStorage.getItem(STORAGE);if(raw===null)return [];const a=JSON.parse(raw);if(!Array.isArray(a)||a.some(r=>typeof r.id!=='string'||!Number.isSafeInteger(r.cents)||r.cents<=0||!validDay(r.date)||!categories.includes(r.category)||typeof r.note!=='string'))throw Error('invalid data');return a}
try{rows=read()}catch(e){loadFailed=true;$('#load-error').hidden=false;$('#load-error').textContent='已有记录无法读取。为避免覆盖数据，暂时停止保存，请保留当前浏览器数据后再排查。';$('#save').disabled=true}
$('#date').value=today();$('#month').value=today().slice(0,7);
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(flashId){let month=$('#month').value;if(!/^\d{4}-\d{2}$/.test(month)){month=today().slice(0,7);$('#month').value=month}const filtered=rows.filter(r=>r.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));const total=filtered.reduce((sum,r)=>sum+r.cents,0);$('#total').textContent=money(total);$('#count').textContent=filtered.length;$('#summary-month').textContent=month.replace('-',' 年 ')+' 月';$('#records').replaceChildren();$('#ledger-table').hidden=!filtered.length;$('#empty').hidden=!!filtered.length;
for(const r of filtered){const tr=node('tr',r.id===flashId?'flash':'');const desc=node('td');desc.append(node('div','record-name',r.note||r.category),node('div','category-label',r.category));tr.append(desc,node('td','',r.date.slice(5).replace('-',' / ')),node('td','record-amount','−'+money(r.cents)));const actions=node('td');const edit=node('button','edit','修改');edit.type='button';edit.setAttribute('aria-label',`修改${r.note||r.category}记录`);edit.onclick=()=>startEdit(r.id);const del=node('button','delete','删除');del.type='button';del.setAttribute('aria-label',`删除${r.note||r.category}记录`);del.onclick=()=>remove(r.id);actions.append(edit,del);tr.append(actions);$('#records').append(tr)}
$('#categories').replaceChildren();const groups=categories.map(c=>[c,filtered.filter(r=>r.category===c).reduce((n,r)=>n+r.cents,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);if(!groups.length){const empty=node('p','stat-sub','记下支出后，这里会显示各分类金额。');empty.style.margin='0 0 8px';$('#categories').append(empty)}for(const [cat,sum]of groups){const row=node('div','category-row');const track=node('div','track');const bar=node('div','bar');bar.style.width=(sum/total*100)+'%';track.append(bar);row.append(node('span','',cat),track,node('span','cat-money',money(sum)));$('#categories').append(row)}}
function clearEdit(){editing=null;$('#form-title').textContent='记一笔支出';$('#save').textContent='保存这笔支出';$('#cancel').hidden=true}
function startEdit(id){const r=rows.find(x=>x.id===id);if(!r)return;editing={id:r.id,updatedAt:r.updatedAt};$('#amount').value=(r.cents/100).toFixed(2);$('#date').value=r.date;$('#category').value=r.category;$('#note').value=r.note;$('#form-title').textContent='修改这笔支出';$('#save').textContent='保存修改';$('#cancel').hidden=false;status('修改保存后，明细和汇总会一起更新。');$('#amount').focus();$('#amount').select()}
$('#cancel').onclick=()=>{clearEdit();$('#amount').value='';$('#note').value='';status('已取消修改。')};$('#month').onchange=()=>render();
$('#entry-form').onsubmit=e=>{e.preventDefault();if(saving||loadFailed)return;const raw=$('#amount').value.trim();if(!/^\d{1,7}(\.\d{1,2})?$/.test(raw)){status('请输入有效金额，最多两位小数。','error');return}const [whole,decimal='']=raw.split('.');const cents=Number(whole)*100+Number(decimal.padEnd(2,'0'));if(cents<=0){status('支出金额需要大于零。','error');return}const date=$('#date').value;if(!validDay(date)){status('请选择有效的消费日期。','error');return}const category=$('#category').value;if(!categories.includes(category)){status('请选择有效的分类。','error');return}
saving=true;$('#save').disabled=true;status('正在保存…');try{const latest=read();const now=new Date().toISOString();const id=editing?editing.id:crypto.randomUUID();const existing=latest.find(r=>r.id===id);if(editing&&(!existing||existing.updatedAt!==editing.updatedAt))throw Error('conflict');const r={id,cents,date,category,note:$('#note').value.trim(),createdAt:existing?existing.createdAt:now,updatedAt:now};const next=editing?latest.map(x=>x.id===id?r:x):[...latest,r];localStorage.setItem(STORAGE,JSON.stringify(next));rows=next;$('#month').value=date.slice(0,7);const wasEdit=!!editing;clearEdit();$('#amount').value='';$('#note').value='';render(id);status(wasEdit?'已保存修改，明细与汇总已更新。':'已保存，刷新页面后仍可查看。','success')}catch(err){status(err.message==='conflict'?'这笔记录已经变化，请重新打开后再修改。':'保存失败，输入已保留。请检查浏览器的存储权限后重试。','error')}finally{saving=false;$('#save').disabled=loadFailed}};
function remove(id){const r=rows.find(x=>x.id===id);if(!r||!confirm(`删除“${r.note||r.category}”这笔 ${money(r.cents)} 的支出？`))return;try{const next=read().filter(x=>x.id!==id);localStorage.setItem(STORAGE,JSON.stringify(next));rows=next;if(editing&&editing.id===id)clearEdit();render();status('已删除这笔支出，汇总已更新。','success')}catch{status('删除失败，原记录仍保留。','error')}}
window.addEventListener('storage',e=>{if(e.key!==STORAGE)return;try{rows=read();render();status('已读取其他页面的更新。')}catch{status('其他页面的数据无法读取，请保留现有输入。','error')}});render();
</script></body></html>
